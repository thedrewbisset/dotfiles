setw -g mode-keys vi

set -s escape-time 10

unbind C-b
set -g prefix C-a

bind a send-keys C-a
bind C-a last-window

bind | split-window -h
bind - split-window -v

# Use up and down arrows for temporary "maximize"
unbind Up; bind Up resize-pane -Z; unbind Down; bind Down resize-pane -Z

# Copy
bind-key -Tcopy-mode-vi v send -X begin-selection
bind-key -Tcopy-mode-vi y send -X copy-pipe-and-cancel pbcopy
bind-key -Tcopy-mode-vi V send -X rectangle-toggle

# Easy config refresh
bind-key r source-file ~/.tmux.conf

set -g @colors-solarized 'dark'

# Creates new window with a liberal history-limit
bind C set-option history-limit 10000 \; new-window

# Check for tpm and install if needed
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"

# Add bindings for vim-tmux-navigator to support directional keys for navigating panes.
#
# The pattern matches the pane's foreground command, so a pane running vim keeps its own
# window navigation and every other pane gets tmux's. `l?n?vim?x?` covers nvim and lvim
# alongside vim; fzf is included because its own C-j/C-k move the selection.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\\' if-shell "$is_vim" 'send-keys C-\\\\'  'select-pane -l'

# The same navigation from inside copy mode, which the root-table bindings above do not
# reach: copy-mode-vi is a separate key table and would otherwise swallow these.
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Collect plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'seebi/tmux-colors-solarized'

# Run tpm
run '~/.tmux/plugins/tpm/tpm'
