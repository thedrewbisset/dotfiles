setw -g mode-keys vi

set -s escape-time 10

unbind C-b
set -g prefix C-a

bind a send-keys C-a
bind C-a last-window

bind | split-window -h
bind - split-window -v

# Use up and down arrows for temporary "maximize"
unbind Up; bind Up resize-pane -Z; unbind Down; bind Down resize-pane -Z

# Copy
bind-key -Tcopy-mode-vi v send -X begin-selection
bind-key -Tcopy-mode-vi y send -X copy-pipe-and-cancel pbcopy
bind-key -Tcopy-mode-vi V send -X rectangle-toggle

# Easy config refresh
bind-key r source-file ~/.tmux.conf

set -g @colors-solarized 'dark'

# Creates new window with a liberal history-limit
bind C set-option history-limit 10000 \; new-window

# Check for tpm and install if needed
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"

# Add bindings for vim-tmux-navigator to support directional keys for navigating panes.
#
# The pattern matches the pane's foreground command, so a pane running vim keeps its own
# window navigation and every other pane gets tmux's. `l?n?vim?x?` covers nvim and lvim
# alongside vim; fzf is included because its own C-j/C-k move the selection.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\\' if-shell "$is_vim" 'send-keys C-\\\\'  'select-pane -l'

# The same navigation from inside copy mode, which the root-table bindings above do not
# reach: copy-mode-vi is a separate key table and would otherwise swallow these.
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Session persistence
#
# tmux-resurrect saves the session tree -- windows, panes, layouts, working
# directories -- to disk and restores it into a server that has lost it.
# tmux-continuum is the timer that drives the save.
#
# The save location is ~/.local/share/tmux/resurrect/ (XDG). resurrect only falls
# back to the older ~/.tmux/resurrect/ when that directory ALREADY exists, so the
# path depends on machine history rather than on this config -- check with
# `tmux show-option -gv @resurrect-dir` (empty means the default applies) before
# assuming either one. Set @resurrect-dir here to pin it if that ever matters.
#
# Restore is deliberately manual (prefix + Ctrl-r). @continuum-restore would
# rebuild every saved session the moment a server starts, which races a
# `tmuxinator start` for the same session name and leaves duplicates behind.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'off'

# The periodic save above is a floor, not the whole story: it can still be up to
# @continuum-save-interval minutes stale. Detaching is the one moment the state
# is known-final, so save then too. tmux fires this on an abrupt client death
# (a closed terminal, a dropped ssh) exactly as it does on a polite detach.
#
# Guarded because the hook is set when this file is sourced, which on a fresh
# machine is before tpm has cloned anything -- an unguarded hook would point at
# a script that does not exist yet and fail on every detach until reinstall.
if-shell '[ -x ~/.tmux/plugins/tmux-resurrect/scripts/save.sh ]' \
   'set-hook -g client-detached "run-shell ~/.tmux/plugins/tmux-resurrect/scripts/save.sh"'

# Collect plugins
# tmux-continuum must be last: it reads the plugin list to find resurrect.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'seebi/tmux-colors-solarized'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Run tpm
run '~/.tmux/plugins/tpm/tpm'
